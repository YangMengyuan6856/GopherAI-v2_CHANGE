global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - recording-rules.yml

scrape_configs:
  - job_name: gopherai-backend
    honor_labels: false
    static_configs:
      - targets:
          - 127.0.0.1:9090
        labels:
          component: backend

  - job_name: gopherai-index-worker
    honor_labels: false
    static_configs:
      - targets:
          - 127.0.0.1:9091
        labels:
          component: index_worker
