[server]
protocol = http
http_addr = 0.0.0.0
http_port = 9093
domain = localhost
root_url = http://localhost:9093/
enable_gzip = true

[database]
type = sqlite3
path = /root/GopherAI_Runtime/grafana/grafana.db

[paths]
data = /root/GopherAI_Runtime/grafana
logs = /root/GopherAI_Runtime/grafana/logs
plugins = /root/GopherAI_Runtime/grafana/plugins
provisioning = /root/GopherAI-/deploy/observability/grafana/provisioning

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
admin_user = gopherai-local
disable_initial_admin_creation = false
cookie_secure = false
allow_embedding = false
disable_gravatar = true

[auth]
disable_login_form = true

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = true

[users]
allow_sign_up = false
allow_org_create = false

[news]
news_feed_enabled = false

[log]
mode = console
level = warn
