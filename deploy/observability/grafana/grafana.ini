[server]
protocol = http
http_addr = 0.0.0.0
http_port = 9093
domain = localhost
root_url = http://localhost:9093/
enable_gzip = true

[database]
type = sqlite3
path = /var/lib/gopherai-grafana/data/grafana.db

[paths]
data = /var/lib/gopherai-grafana/data
logs = /var/lib/gopherai-grafana/logs
plugins = /var/lib/gopherai-grafana/plugins
provisioning = /var/lib/gopherai-grafana/provisioning

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
plugin_admin_enabled = false
preinstall_disabled = true
preinstall_auto_update = false
public_key_retrieval_disabled = true
disable_plugins = elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin

[security]
admin_user = gopherai-local
disable_initial_admin_creation = false
cookie_secure = false
allow_embedding = false
disable_gravatar = true

[auth]
disable_login_form = true

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = false

[users]
allow_sign_up = false
allow_org_create = false

[news]
news_feed_enabled = false

[log]
mode = console
level = warn
