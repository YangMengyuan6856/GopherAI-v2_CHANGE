[mainConfig]
appName = "GopherAI"
host = "0.0.0.0"
port = 9090
contextTokenBudget = 8192  # 上下文窗口 token 预算，0 表示不限制（发送全部历史）

[emailConfig]
authcode = "your authcode "
email = "your qq email"

[redisConfig]
host = "redis-vector"
port = 6379
password = ""
db = 0

[mysqlConfig]
host = "127.0.0.1"
port = 3306
user = "root"
password = "123456"
databaseName = "GopherAI"
charset =  "utf8mb4"

[jwtConfig]
 expire_duration= 8760
 issuer= "huanheart"
 subject= "GopherAI"
 key= "GopherAI-v1"

 [rabbitmqConfig]
  host= "rabbitmq"
  port= 5672
  username= "root"
  password= "123456"
  vhost= "/"

 [ragModelConfig]
  embeddingModel= "text-embedding-v4"
  chatModelName="qwen-turbo"
  docDir = "./docs"
  baseUrl="https://dashscope.aliyuncs.com/compatible-mode/v1"
  dimension=1024

  [voiceServiceConfig]
  voiceServiceApiKey = "baiduApiKey"
  voiceServiceSecretKey ="baiduSecretKey"

  [reactConfig]
  maxIterations = 10          # ReAct 最大推理迭代次数
  mcpBaseURL = "http://localhost:8081/mcp"  # MCP 服务地址

  [memoryConfig]
  enableSummary = true              # 是否启用摘要记忆（超出上下文时自动压缩旧消息）
  enableLongTermMemory = true       # 是否启用长期记忆（跨会话记住用户偏好/事实）
  summaryTriggerRatio = 0.7         # 摘要触发阈值（已用 token / 预算），超过此比例开始摘要
  summaryMaxTokens = 500            # 摘要文本的最大 token 数
  longTermMemoryMaxEntries = 50     # 每用户最大长期记忆条目数
  systemPrompt = "你是 GopherAI 智能助手，一个功能强大、友善且专业的 AI 对话伙伴。请根据用户的需求提供准确、有帮助的回答。"

  [pprofConfig]
  enabled = false                   # 默认关闭；压测/排障时临时开启
  host = "127.0.0.1"               # 默认仅容器/机器本机可访问，不暴露公网
  port = 6060
  readTimeoutSeconds = 5
  writeTimeoutSeconds = 30
